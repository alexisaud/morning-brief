name: Collect (news, neige, Telegram, citation)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests feedparser beautifulsoup4
      - name: Collect
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python scripts/collect.py
      - name: Commit
        if: always()
        run: |
          git config user.name "morning-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ state/ || true
          git commit -m "collect: $(TZ=Europe/Zurich date '+%F %H:%M')" || echo "nothing to commit"
          git pull --rebase origin main
          git push origin HEAD:main
