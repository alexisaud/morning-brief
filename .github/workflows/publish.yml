name: Publish (voix + Telegram)

on:
  push:
    branches: [main]
    paths:
      - "episodes/**/script.txt"
  workflow_dispatch:
    inputs:
      mode:
        description: "episode | samples | notify"
        default: "episode"
      date:
        description: "Date de l'épisode (YYYY-MM-DD), vide = dernier non envoyé"
        default: ""
      text:
        description: "Texte du message (mode notify)"
        default: ""

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests edge-tts mutagen
      - name: Publish
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'episode' }}
          DATE: ${{ github.event.inputs.date }}
          TEXT: ${{ github.event.inputs.text }}
        run: |
          case "$MODE" in
            samples) python scripts/publish.py --samples ;;
            notify)  python scripts/publish.py --notify "$TEXT" ;;
            *)       if [ -n "$DATE" ]; then python scripts/publish.py --date "$DATE"; else python scripts/publish.py; fi ;;
          esac
      - name: Keep audio (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio
          path: out/*.mp3
          retention-days: 7
          if-no-files-found: ignore
      - name: Commit
        if: always()
        run: |
          git config user.name "morning-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes/ samples/ || true
          git commit -m "publish: $(TZ=Europe/Zurich date '+%F %H:%M')" || echo "nothing to commit"
          git pull --rebase origin main
          git push origin HEAD:main
